[package]
name = "sleep-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework - async HTTP server with routing and middleware
axum = { version = "0.7", features = ["ws"] }

# Async runtime - provides async/await support and task scheduling
tokio = { version = "1.0", features = ["full"] }

# Serialization - convert Rust structs to/from JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP middleware - CORS support for frontend access
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Redis - cache for real-time data (Branch 1)
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Logging and tracing - structured logging with spans
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling - better error types
thiserror = "1.0"
anyhow = "1.0"

# Date/time handling - for timestamps
chrono = { version = "0.4", features = ["serde"] }

# Database - PostgreSQL async driver
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

# Authentication - JWT token generation and validation
jsonwebtoken = "9.0"

# Future dependencies (commented out for now):
