services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sleep-monitor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sleep_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sleep-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sleep-monitor-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sleep-network

  # Rust Backend + Frontend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sleep-monitor-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/sleep_monitor
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-for-docker}
      RUST_LOG: info
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sleep-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  sleep-network:
    driver: bridge
